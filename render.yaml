# Render Blueprint: one-click deploy of the API (the database lives on Neon, see README).
# Render > New > Blueprint > pick this repo. Secrets marked "sync: false" are asked for in the dashboard.
services:
  - type: web
    name: bookmyseat
    runtime: docker            # builds the Dockerfile in this repo
    plan: free                 # can be switched to "starter" later without redeploying
    region: singapore          # keep this the same region as the Neon database
    healthCheckPath: /health   # liveness: does not depend on the database
    autoDeploy: true
    envVars:
      - key: DB_URL            # jdbc:postgresql://<neon-direct-host>/<db>?sslmode=require
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_API_KEY     # the key that makes POST /auth/token return an ADMIN token
        sync: false
      - key: JWT_SECRET        # token signing key, generated by Render (>= 32 bytes)
        generateValue: true
      - key: DB_POOL_SIZE
        value: "10"
      # Free instances have ~0.1 CPU: use the serial GC and the quick JIT tier so the JVM
      # starts fast and does not burn the little CPU it has on background compilation.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=65 -XX:+ExitOnOutOfMemoryError -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k"
