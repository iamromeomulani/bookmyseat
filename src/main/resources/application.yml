server:
  port: ${PORT:8080}          # Render/Railway inject PORT
  shutdown: graceful

spring:
  application:
    name: bookmyseat
  threads:
    virtual:
      enabled: true           # cheap blocking threads for burst traffic
  jackson:
    property-naming-strategy: SNAKE_CASE   # price_paise, per_user_limit ...
    deserialization:
      accept-float-as-int: false            # reject 250.5 for money fields
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookmyseat}
    username: ${DB_USER:bookmyseat}
    password: ${DB_PASSWORD:bookmyseat}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 2000          # fail fast; we turn this into a 429 later
      initialization-fail-timeout: -1   # start even if DB is slow (cold start)
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true         # /actuator/health/liveness and /readiness
      show-details: never

app:
  security:
    # HMAC key used to sign/verify tokens. MUST be overridden in production (>= 32 bytes).
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-in-prod-0123456789}
    # Presenting this key to /auth/token yields an ADMIN token.
    admin-api-key: ${ADMIN_API_KEY:dev-admin-key}
    token-ttl: 24h
